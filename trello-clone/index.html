<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トレロ風タスク管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>タスクボード</h1>
</header>

<main class="board">

  <section class="list" data-list-id="todo">
    <h2>未着手</h2>
    <div class="cards" data-list-id="todo"></div>
    <form class="add-card-form" data-list-id="todo">
      <input type="text" placeholder="タスクを入力してEnter" required>
    </form>
  </section>

  <section class="list" data-list-id="doing">
    <h2>進行中</h2>
    <div class="cards" data-list-id="doing"></div>
    <form class="add-card-form" data-list-id="doing">
      <input type="text" placeholder="タスクを入力してEnter" required>
    </form>
  </section>

  <section class="list" data-list-id="done">
    <h2>完了</h2>
    <div class="cards" data-list-id="done"></div>
    <form class="add-card-form" data-list-id="done">
      <input type="text" placeholder="タスクを入力してEnter" required>
    </form>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
