spring.application.name=taskboard-backend

# 開発用の接続情報(環境変数で上書き可能)。ローカルのPostgreSQLのみを想定した値で、秘密情報ではない
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskboard}
spring.datasource.username=${DB_USERNAME:taskboard}
spring.datasource.password=${DB_PASSWORD:taskboard}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8080

# フロントエンド(Vite)の開発サーバーからの呼び出しを許可する
taskboard.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
